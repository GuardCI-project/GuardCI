# ORFS flow scripts (recipe path scripts/**): file name -> tags.
# Files not listed map to `scripts` + `unknown`.
scripts:
  synth.tcl:              [synthesis]
  synth_preamble.tcl:     [synthesis]
  synth_hier_report.tcl:  [synthesis]
  floorplan.tcl:          [floorplan]
  io_placement.tcl:       [floorplan]
  io_placement_random.tcl: [floorplan]
  macro_place.tcl:        [floorplan]
  tapcell.tcl:            [physical_integrity]
  pdn.tcl:                [physical_integrity]
  global_place.tcl:       [placement]
  global_place_skip_io.tcl: [placement]
  resize.tcl:             [placement, physical_integrity]
  detail_place.tcl:       [placement]
  cts.tcl:                [cts]
  global_route.tcl:       [routing]
  detail_route.tcl:       [routing]
  fillcell.tcl:           [physical_integrity]
  density_fill.tcl:       [physical_integrity]
  final_report.tcl:       [measurement]
  report_metrics.tcl:     [measurement]
  write_ref_sdc.tcl:      [constraints]
  load.tcl:               [library_refs, unknown]
  variables.mk:           [unknown]
  Makefile:               [unknown]
