# ORFS config.mk variable -> delta tag (DESIGN.md §3.4).
#
# A commit that changes a variable receives every tag listed for it.
# Variables not listed here map to `unknown`, which routes to heavy
# verification. Keep this table conservative: when a variable plausibly
# affects a signoff dimension, tag it `physical_integrity` as well.
#
# Tags: constraints synthesis floorplan placement cts routing
#       physical_integrity library_refs design_refs scripts measurement
#
# `design_refs`  : variables that decide WHICH design is implemented
#                  (checked by `design_identity`, hard).
# `library_refs` : variables that point at libraries / LEF / RC models
#                  (checked by `protected_refs`, route -> heavy).
# `measurement`  : variables with no effect on the artifacts the CI
#                  rebuilds (reporting, parallelism, naming); routed nowhere.

# Deliberately unlisted (map to `unknown` → heavy): agent-invented or
# tool-path variables that ORFS itself does not declare in
# scripts/variables.yaml (ABC9_GIA_SCRIPT, ABC9_DELAY_PS,
# CTS_CLK_BUFFER_LIST, SETUP_MOVE_SEQUENCE_POST_GLOBAL_ROUTE, PPA_WRAP,
# REPAIR_SETUP_ONLY, SKIP_FLOORPLAN_TIMING_REPAIR,
# SYNTH_ABC_DELAY_TARGET_PS, OUTPUT_REGISTER_PORTS, AREA_RESTRUCTURE,
# KEPLER_FORMAL_EXE, OPENROAD_EXE, OPENSTA_EXE, YOSYS_EXE), and
# KEEP_VARS. This is on purpose: we cannot know what they do, so they
# stay heavy.

design_refs:
  - DESIGN_NAME
  - DESIGN_NICKNAME
  - PLATFORM
  - VERILOG_FILES
  - VERILOG_INCLUDE_DIRS
  - VERILOG_TOP_PARAMS
  - SYNTH_BLACKBOXES
  - SYNTH_NETLIST_FILES   # decides which netlist is implemented
  - SDC_FILE            # must resolve to impl.sdc (recipe) or the golden SDC

library_refs:
  - LIB_FILES
  - ADDITIONAL_LIBS
  - LEF_FILES
  - ADDITIONAL_LEFS
  - TECH_LEF
  - SC_LEF
  - GDS_FILES
  - ADDITIONAL_GDS
  - DFF_LIB_FILE
  - RCX_RULES
  - SET_RC_TCL
  - CORNER
  - PLATFORM_DIR
  - LATCH_MAP_FILE
  - CLKGATE_MAP_FILE
  - ADDER_MAP_FILE
  - FILL_CELLS
  - TIE_SEPARATION
  - TIEHI_CELL_AND_PORT
  - TIELO_CELL_AND_PORT
  - MIN_BUF_CELL_AND_PORTS
  - HOLD_BUF_CELL
  - ABC_DRIVER_CELL
  - ABC_LOAD_IN_FF

