<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GuardCI — Git-native verification for autonomous EDA</title>
  <desc id="desc">A dark navy banner with the GuardCI wordmark and a schematic showing recipe commits passing through owner-controlled verification before delivery.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c31"/><stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#203047" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#background)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)" opacity=".36"/>
  <path d="M64 54h40" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="120" y="60" fill="#91a4bd" font-size="13" font-weight="600" letter-spacing="2">GIT-NATIVE VERIFICATION</text>
    <text x="60" y="173" fill="#f1f5f9" font-size="86" font-weight="750" letter-spacing="-4">Guard<tspan fill="#5eead4">CI</tspan></text>
    <text x="64" y="219" fill="#cbd5e1" font-size="24">Continuous verification for autonomous EDA.</text>
    <text x="64" y="256" fill="#91a4bd" font-size="17">Push recipes. Check contracts. Deliver verified results.</text>
    <path d="M64 292H676" stroke="#28384f"/>
    <text x="64" y="322" fill="#5eead4" font-size="12" font-weight="600" letter-spacing="2">PROTECTED INPUTS</text>
    <text x="266" y="322" fill="#91a4bd" font-size="12" font-weight="600" letter-spacing="2">INDEPENDENT CHECKS</text>
    <text x="496" y="322" fill="#91a4bd" font-size="12" font-weight="600" letter-spacing="2">TRACEABLE DELIVERY</text>
    <path d="M785 52V308" stroke="#28384f"/>
    <path d="M934 116V149M934 211V244" stroke="#5eead4" stroke-width="2"/>
    <path d="m930 142 4 5 4-5m-8 95 4 5 4-5" fill="none" stroke="#5eead4" stroke-width="2"/>
    <rect x="836" y="60" width="196" height="56" rx="10" fill="#142238" stroke="#34475f"/>
    <text x="861" y="83" fill="#91a4bd" font-size="10" letter-spacing="1.5">01 / AUTHOR</text>
    <text x="861" y="104" fill="#e2e8f0" font-size="17" font-weight="600">git push</text>
    <rect x="836" y="153" width="260" height="58" rx="10" fill="#0e3033" stroke="#5eead4"/>
    <text x="861" y="177" fill="#5eead4" font-size="10" letter-spacing="1.5">02 / OWNER-CONTROLLED</text>
    <text x="861" y="198" fill="#ecfdf5" font-size="17" font-weight="600">Verify against contract</text>
    <rect x="836" y="248" width="196" height="56" rx="10" fill="#142238" stroke="#34475f"/>
    <text x="861" y="271" fill="#91a4bd" font-size="10" letter-spacing="1.5">03 / ACCEPTED ONLY</text>
    <text x="861" y="292" fill="#e2e8f0" font-size="17" font-weight="600">guardci deliver</text>
  </g>
</svg>
