name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tcl iverilog
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q guardci scripts
      - run: python -m build
      - name: Check wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_distribution.py"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_git_ci.py" --root "$RUNNER_TEMP/wheel-smoke"
      - name: Check source distribution outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_distribution.py"
          "$RUNNER_TEMP/sdist-env/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_git_ci.py" --root "$RUNNER_TEMP/sdist-smoke"
